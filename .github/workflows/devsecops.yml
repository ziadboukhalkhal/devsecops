name: DevSecOps Pipeline


on:
  push:
    branches: [main]
    pull_request:
      branches: [main]
    workflow_dispatch:

jobs:
  sanity_check:
    name: Pipeline Sanity Check
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4
        - name: Confirm Code Checkout
          run: | 
            echo "Code checkout successful. Current directory contents:"
            ls -la
  
  secrets-scan:
    name: Secrets Scan (GitLeaks)
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0
        - name: Run GitLeaks Scan
          uses: gitleaks/gitleaks-action@v3
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  secrets-scan-full-history:
    name: Secrets Scan — Full History (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks against entire git history
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz -C /tmp
          /tmp/gitleaks detect --source . -v --redact

