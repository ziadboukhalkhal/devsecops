name: DevSecOps Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  sanity-check:
    name: Pipeline sanity check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Confirm checkout worked
        run: |
          echo "Repo checked out fine."
          ls -la
  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  sast:
    name: SAST (Bandit + Semgrep)
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit
        run: bandit -r . -x ./tests -f json -o bandit-report.json || true
      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/python \
            --config p/flask \
            --config p/owasp-top-ten \
            --config p/sql-injection \
            --json --output semgrep-report.json || true
      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
  sca:
    name: Dependency Scan (Snyk)
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4
      - name: Run Snyk 
        uses: snyk/actions/python-3.9@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=requirements.txt --json-file-output=snyk-report.json
  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [sast, sca]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run : docker build -t vuln-bank:${{ github.sha }} .
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: vuln-bank:${{ github.sha }}
          format: sarif
          output: trivy-report.sarif
          severity: CRITICAL,HIGH
      - name: Upload Trivy report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-report.sarif

  


