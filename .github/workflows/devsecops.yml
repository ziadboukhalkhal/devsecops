name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Lesson 1: pipeline plumbing ──────────────────────────────
  sanity-check:
    name: Pipeline sanity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm checkout worked
        run: |
          echo "Repo checked out fine."
          ls -la

  # ── Lesson 2: secrets scanning ───────────────────────────────
  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history available, though the action only diffs this push by default
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 

  sast:
    name: SAST (Bandit + Semgrep)
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v4
          with:
            python-version: '3.11'
        - name: Install Bandit
          run: pip install bandit
        - name: Run Bandit
          run: bandit -r . -x ./tests -f sarif -o bandit-report.sarif || true
        - name: Upload Bandit report
          uses: actions/upload-artifact@v4
          with:
            name: bandit-report
            path: bandit-report.sarif
        - name: Run Semgrep
          uses: semgrep/semgrep-action@v1
          with:
            config: >-
                p/python p/flast p/owasp-top-ten p/sql-injection
